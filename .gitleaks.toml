# gitleaks 配置：继承官方默认规则集，仅对已知误报开窄口。
[extend]
useDefault = true

[allowlist]
description = "仅排除既有一次性测试假值及已核实的完整公开 CDN 域名"
paths = ['''server/webServer\.delivery\.test\.cjs''', '''server/webServer\.reference\.test\.cjs''']

# 历史 SNAPSHOT_HOSTS 中的公开对象存储域名被 generic-api-key 误判；仅匹配该完整域名。
regexTarget = "secret"
regexes = ['''^vcg\-prod\-1258344699\.cos\.ap\-guangzhou\.tencentcos\.cn$''']
