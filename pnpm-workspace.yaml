allowBuilds:
  sharp: true

# 线上服务器 CPU 只支持 x86-64 baseline（v1），sharp >= 0.34 的 Linux 预编译包要求
# x86-64-v2 而无法加载，故固定 sharp 0.33.5，并按下列 advisories 的官方缓解在
# electron/services/sharpRuntime.cjs 中禁用 GIF/TIFF/VIPS/HEIF（含 AVIF）解码器
# （位图仅支持 PNG/JPEG/WebP，SVG 组件走独立加载器）。豁免理由与退出条件见 docs/decisions/ADR-010-sharp-pinned-for-x64v1-runtime.md。
auditConfig:
  ignoreGhsas:
    - GHSA-f88m-g3jw-g9cj
    - GHSA-rgj7-g3m4-5g8c
